<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>JARVIS overlay</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body { background: transparent; margin: 0; overflow: hidden; }
    body { width: 100vw; height: 100vh; }
    #ring { width: 100%; height: 100%; min-width: 0; }
    .frame, #titlebar { display: none !important; }
  </style>
</head>
<body data-mode="standby" data-visual="jarvis">
  <div id="ring" data-mode="standby">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="core">
      <div id="core-label">STANDBY</div>
      <div id="core-visual">JARVIS</div>
    </div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
