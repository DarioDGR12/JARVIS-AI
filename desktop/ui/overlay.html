<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>JARVIS overlay</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body { background: transparent; margin: 0; overflow: hidden; }
    body { width: 100vw; height: 100vh; }
    #ring { width: 100%; height: 100%; min-width: 0; }
    .frame, #titlebar { display: none !important; }
    .ov-chrome {
      position: absolute; top: 0; left: 0; right: 0; height: 32px; z-index: 4;
      display: flex; align-items: center; justify-content: center;
      font: 10px/1 ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0.16em; text-transform: uppercase; color: #7ad7ff;
      cursor: move; user-select: none;
    }
  </style>
</head>
<body data-mode="standby" data-visual="jarvis">
  <div class="ov-chrome" data-tauri-drag-region>JARVIS</div>
  <div id="ring" data-mode="standby">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="core">
      <div id="core-label">STANDBY</div>
      <div id="core-visual">JARVIS</div>
    </div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
