[project]
name = "jarvis-brain"
version = "0.1.0"
description = "JARVIS orchestrator: event bus, Hermes, local TTS (Chatterbox), auth, tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
tts = [
    # Chatterbox engine is local. Do NOT install realtimetts[all] (pulls ElevenLabs).
    "realtimetts[chatterbox]==0.8.5",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
